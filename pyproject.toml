[project]
name = "agentcore-quality"
version = "0.1.0"
description = "AIエージェントの評価とガードレールのサンプル"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.23.1",
    "boto3>=1.43.62",
    "strands-agents>=1.57.0",
]

# 各章のスクリプトから `from shared.common import ...` で
# 読めるように、共通の処理を shared パッケージとして入れる
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.ruff]
# 本に載せるコードは 1 行 68 桁以内（A5 の枠）
line-length = 68

[tool.ruff.lint.isort]
known-first-party = ["shared", "resources", "search"]
